<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Super Mario 64</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* The X screen IS the viewport here, so the canvas simply fills it. */
  #canvas { display: block; width: 100vw; height: 100vh; background: #000; image-rendering: pixelated; }
</style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
<script>
  // ── Render small, display big ──────────────────────────────────────────
  //
  // SDL sizes the canvas to the X screen (854x480 here), and SwiftShader draws
  // every one of those pixels on a CPU with no GPU. Measured on the live box:
  // one chromium renderer at 137% CPU out of a 170% container budget, which
  // left nothing for the x264 encoder and made the stream lag.
  //
  // Same fix the standalone wasm build uses: clamp the drawing buffer, then
  // scale the GL viewport by the SAME ratio. Clamping alone is not enough —
  // the game sets its viewport from SDL's window size, so the buffer shrinks
  // while the projection does not and you see the top-left corner of the frame.
  // CSS then stretches the small buffer back over the whole screen.
  const RENDER_W = 480;
  let sdlW = 0, renderH = 270;

  for (const prop of ['width', 'height']) {
    const desc = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, prop);
    Object.defineProperty(HTMLCanvasElement.prototype, prop, {
      configurable: true,
      get() { return desc.get.call(this); },
      set(v) {
        if (this.id !== 'canvas') return desc.set.call(this, v);
        if (prop === 'width') {
          if (v > 1) sdlW = v;
          return desc.set.call(this, RENDER_W);
        }
        // Derive height from SDL's aspect so nothing is stretched.
        if (v > 1 && sdlW > 1) renderH = Math.round(RENDER_W * (v / sdlW));
        return desc.set.call(this, renderH);
      },
    });
  }

  function scaleGl(proto) {
    if (!proto) return;
    for (const fn of ['viewport', 'scissor']) {
      const orig = proto[fn];
      if (!orig) continue;
      proto[fn] = function (x, y, w, h) {
        if (sdlW > 1 && this.canvas && this.canvas.id === 'canvas') {
          const k = this.drawingBufferWidth / sdlW;
          return orig.call(this, Math.round(x * k), Math.round(y * k),
                                 Math.round(w * k), Math.round(h * k));
        }
        return orig.call(this, x, y, w, h);
      };
    }
  }
  scaleGl(window.WebGLRenderingContext && WebGLRenderingContext.prototype);
  scaleGl(window.WebGL2RenderingContext && WebGL2RenderingContext.prototype);

  // Minimal SM64 host for the DESKTOP build.
  //
  // Deliberately NOT arena/host/host.html: that page also encodes the canvas
  // with WebCodecs and connects to the relay as the host. In this build the
  // agent already captures X and owns the relay link, so a second host would
  // fight it for the socket. This page only renders the game — pixels reach
  // viewers through x11grab like every other game, and audio through Pulse.
  window.Module = window.Module || {};
  Module.canvas = document.getElementById('canvas');
  Module.locateFile = (p) => (p.endsWith('.wasm') ? './sm64.wasm' : p);
  Module.preRun = Module.preRun || [];
  Module.postRun = Module.postRun || [];
  Module.print = (t) => console.log(t);
  Module.printErr = (t) => console.warn(t);
  Module.setStatus = () => {};

  // Persistent save, same IDBFS mount the wasm build used. Chromium's profile
  // lives on the /data volume, so stars survive restarts.
  Module.preRun.push(function () {
    try {
      if (Module.FS && Module.IDBFS) {
        try { Module.FS.mkdir('/save'); } catch {}
        Module.FS.mount(Module.IDBFS, {}, '/save');
      }
    } catch (err) { console.error('save mount failed:', err); }
  });

  Module.onRuntimeInitialized = function () {
    try {
      if (Module.FS && Module.IDBFS) {
        Module.FS.syncfs(true, (e) => { if (e) console.warn('save load error:', e); });
        window.saveNow = function () {
          try { if (typeof Module.writeSave === 'function') Module.writeSave(); } catch {}
          Module.FS.syncfs(false, () => {});
        };
        setInterval(() => window.saveNow(), 5000);
      }
    } catch (err) { console.error('save init failed:', err); }
    // The game only takes keyboard input while the canvas has focus, and
    // xdotool types into whatever is focused.
    try { document.getElementById('canvas').focus(); } catch {}
  };
  window.addEventListener('click', () => { try { document.getElementById('canvas').focus(); } catch {} });
</script>
<script src="./sm64.js"></script>
</body>
</html>
