# RetroArch lockdown config for the arena.
#
# The F1 screenshot during testing showed the Quick Menu wide open, with
# "Close Content" and "Core Options" one keypress away from anyone in the crowd.
# Build-time lockdown (no browser, no terminal, nothing installed to launch)
# does nothing about an escape hatch inside the emulator itself, so it gets
# closed here.
#
# Passed with --config so it cannot be overwritten by a user-writable file, and
# config_save_on_exit is off so nothing the session does can persist a change.

# ── Hotkeys that end or escape the session ──────────────────────────────────
input_menu_toggle = "nul"
input_exit_emulator = "nul"
input_toggle_fullscreen = "nul"
input_grab_mouse_toggle = "nul"
input_game_focus_toggle = "nul"
input_screenshot = "nul"
input_netplay_game_watch = "nul"
input_pause_toggle = "nul"
input_rewind = "nul"
input_shader_next = "nul"
input_shader_prev = "nul"
input_disk_eject_toggle = "nul"
input_disk_next = "nul"
input_disk_prev = "nul"
input_reset = "nul"

# ── The Qt "desktop menu" must never appear ─────────────────────────────────
#
# RetroArch 1.20 (trixie) starts a Qt companion window on boot: File/Edit/View
# menus, a file browser and the full settings tree, sitting on top of the game.
# That is a complete escape hatch inside an otherwise locked image — kiosk mode
# does NOT cover it, because it is a separate UI.
ui_companion_start_on_boot = "false"
ui_companion_enable = "false"
ui_companion_toggle = "false"
desktop_menu_enable = "false"

# ── Kiosk mode: hides settings and configuration from the menu entirely ─────
kiosk_mode_enable = "true"
menu_show_load_core = "false"
menu_show_load_content = "false"
menu_show_quit_retroarch = "false"
menu_show_restart_retroarch = "false"
menu_show_configurations = "false"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_show_information = "false"
menu_show_help = "false"
content_show_favorites = "false"
content_show_history = "false"
content_show_images = "false"
content_show_music = "false"
content_show_video = "false"
content_show_netplay = "false"
content_show_settings = "false"
content_show_add = "false"

# Nothing this session does may be written back.
config_save_on_exit = "false"
savestate_auto_save = "false"

# ── Video ───────────────────────────────────────────────────────────────────
# No GPU on this box: llvmpipe through the gl driver. Fullscreen and borderless
# so the game owns the whole framebuffer and there is no desktop behind it.
video_driver = "gl"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_vsync = "false"
# Xvfb has no real vsync, so video cannot pace the run loop. RetroArch therefore
# paces against AUDIO — and when pulse failed to start it had nothing to pace
# against and ran the emulator flat out ("everything at turbo speed").
#
# audio_sync is the normal throttle; fastforward_ratio is the safety net that
# caps the run loop at 1x even if the audio device never opens, so a broken
# sound setup degrades to "silent" instead of "unplayable".
fastforward_ratio = "1.0"
video_threaded = "true"
video_font_enable = "true"

# ── Audio ───────────────────────────────────────────────────────────────────
audio_driver = "pulse"
audio_enable = "true"
audio_sync = "true"

# ── Saves stay on the mounted volume, not in the image ──────────────────────
savefile_directory = "/data/saves"
savestate_directory = "/data/saves"
system_directory = "/data/system"
