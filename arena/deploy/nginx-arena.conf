# Mario Arena — host-level nginx location block for ropeway-per-bronze.
#
# Drop this INSIDE the existing server{} block that already serves the
# vnc-activity stack on :8000 (/etc/nginx/sites-available/vnc-activity), or use
# it as its own server block on a separate port.
#
# proxy_buffering off is NOT optional. Buffering a WebSocket carrying video is
# exactly the bug that made the VNC activity on this box feel "super slow" —
# nginx sits on frames waiting for a buffer to fill while the game runs ahead.

location /ws {
    proxy_pass http://127.0.0.1:8090/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_buffering off;
    proxy_request_buffering off;
    tcp_nodelay on;

    # Video sessions are long-lived and mostly server->client; don't let nginx
    # time out a viewer who is watching quietly without pressing anything.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /api/ {
    proxy_pass http://127.0.0.1:8090/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}

location / {
    proxy_pass http://127.0.0.1:8090/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
}
